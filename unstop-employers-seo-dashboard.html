<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employers SEO Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--panel-2:#f1f3f6;--line:#e3e6eb;--text:#151a22;--muted:#5d6675;--faint:#8a93a2;
  --accent:#3b5bdb;--accent-soft:#e8edff;--good:#1f8a4c;--good-soft:#e3f5ea;--warn:#a86400;--warn-soft:#fff2db;--bad:#c0392b;--bad-soft:#fde8e6;
  --p1:#1f8a4c;--p2:#a86400;--p3:#6b7280;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1217;--panel:#171b22;--panel-2:#1e232c;--line:#2a303b;--text:#e7eaf0;--muted:#a3abb9;--faint:#778194;
  --accent:#8ea2ff;--accent-soft:#232c4d;--good:#5fd08e;--good-soft:#16301f;--warn:#f0b35a;--warn-soft:#33270f;--bad:#ff8a7d;--bad-soft:#3a1d1a;
  --p1:#5fd08e;--p2:#f0b35a;--p3:#9aa3b2;--shadow:none;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:58px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:600}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--good-soft);color:var(--good)}.pill.snap{background:var(--warn-soft);color:var(--warn)}.pill.err{background:var(--bad-soft);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.banner{margin:16px 0 0;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.banner code{font-family:var(--mono);font-size:12px}
main{padding:18px 0 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em}
.kpi span{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:220px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.toolbar select,.toolbar input[type=number]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.toolbar input[type=number]{width:110px}
.count{color:var(--muted);font-size:12px;margin-left:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.tablewrap{overflow:auto;max-height:calc(100vh - 260px)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{position:sticky;top:0;background:var(--panel-2);font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
thead th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
thead th .arr{opacity:.35;margin-left:4px}thead th.sorted .arr{opacity:1;color:var(--accent)}
tbody tr:hover{background:var(--panel-2)}
tbody tr.click{cursor:pointer}
td .path{font-family:var(--mono);font-size:12.5px;word-break:break-all}
td .sub{color:var(--muted);font-size:12px}
.prio{display:inline-block;min-width:26px;text-align:center;font-weight:700;font-size:12px;padding:1px 6px;border-radius:6px;background:var(--panel-2)}
.prio.P1{color:var(--p1);background:var(--good-soft)}.prio.P2{color:var(--p2);background:var(--warn-soft)}.prio.P3{color:var(--p3)}
.vol{display:inline-block;min-width:44px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.vol.z{color:var(--faint);font-weight:500}.vol.hi{color:var(--good)}.vol.na{color:var(--faint);font-weight:400;font-style:italic}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;background:var(--panel-2);color:var(--muted);margin:2px 4px 2px 0;white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.35);z-index:40;display:none}
.scrim.on{display:block}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;border-left:1px solid var(--line)}
aside.drawer.on{transform:none}
.dhead{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;gap:12px;align-items:flex-start}
.dhead h2{margin:0;font-size:18px;letter-spacing:-.01em}
.dhead .path{font-family:var(--mono);font-size:12.5px;color:var(--muted);word-break:break-all}
.dbody{overflow:auto;padding:16px 20px 40px;flex:1}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec>h3{margin:0;padding:12px 16px;font-size:14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.sec>h3 .n{color:var(--muted);font-weight:500;font-size:12px}
.sec>.in{padding:12px 16px}
.sec table th{position:static}
.target{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
.target .kw{font-size:20px;font-weight:700;letter-spacing:-.01em}
.target .meta{color:var(--muted);font-size:13px}
.note{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--panel-2);font-size:13px}
.note b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mx{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mx div h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.mx ul{margin:0;padding-left:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}
.stats div{background:var(--panel-2);border-radius:8px;padding:8px 10px}
.stats b{display:block;font-size:17px}.stats span{font-size:11px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.x{border:0;background:var(--panel-2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;display:none}
.loading{padding:60px;text-align:center;color:var(--muted)}
details.legacy{margin-top:16px}
details.legacy summary{cursor:pointer;font-weight:600;padding:10px 0}
@media (max-width:760px){
  .wrap{padding:0 12px}.grid2{grid-template-columns:1fr}
  .hide-sm{display:none}
  .tablewrap{max-height:none}
  .dbody{padding:12px}
}
</style>
</head>

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',1800);}

function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===','){row.push(f);f='';}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else if(c!=='\r')f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
// header-name based column access
function table(rows){
  const head=(rows[0]||[]).map(h=>norm(h));
  const col=(...names)=>{for(const n of names){const nn=norm(n);const i=head.findIndex(h=>h===nn);if(i>=0)return i;}
    for(const n of names){const nn=norm(n);const i=head.findIndex(h=>h.startsWith(nn));if(i>=0)return i;}return -1;};
  return {rows:rows.slice(1),col,get:(r,i)=>i<0?'':(r[i]==null?'':String(r[i]).trim())};
}

let M=null;
function groupOf(k){
  if(/employer-branding|brand-and-advertise/.test(k))return'Employer branding & engagement';
  if(/ai-assessment-agent|ai-proctoring/.test(k))return'Assessments';
  if(/ai-sourcing-agent|ai-screening/.test(k))return'Sourcing & screening';
  if(/ai-interview|ai-calling|ai-scheduling/.test(k))return'AI interview, calling & scheduling';
  return'Hiring platform & ATS';
}
function build(){
  const m={pages:[],byKey:{},kw:[],traps:[],lt:[],mc:[],mp:[],pt:[],rq:[],tech:{},comp:[],cb:[],legacy:[]};
  // Matrix -> page list
  if(RAW.mx){const T=table(RAW.mx);const c={u:T.col('Target page'),s:T.col('1. Solution'),i:T.col('2. Industry'),co:T.col('3. Competitor'),w:T.col('Why buyers switch'),j:T.col('4. Job to be done'),in:T.col('5. Integration'),e:T.col('Example long-tail')};
    T.rows.forEach(r=>{const u=T.get(r,c.u);if(!u)return;const k=keyOf(u);
      const p={key:k,url:u.startsWith('http')?u:CONFIG.site+k,group:groupOf(k),product:'',matrix:{solution:lines(T.get(r,c.s)),industry:lines(T.get(r,c.i)),competitor:lines(T.get(r,c.co)),why:T.get(r,c.w),jobs:lines(T.get(r,c.j)),integrations:lines(T.get(r,c.in)),example:T.get(r,c.e)}};
      if(!m.byKey[k]){m.byKey[k]=p;m.pages.push(p);}});}
  const ensure=(k,url,product)=>{if(!k||k==='/')return null;if(!m.byKey[k]){const p={key:k,url:url||CONFIG.site+k,group:groupOf(k),product:product||'',matrix:null};m.byKey[k]=p;m.pages.push(p);}const p=m.byKey[k];if(product&&!p.product)p.product=product;return p;};
  // Money keywords
  if(RAW.mk){const T=table(RAW.mk);const c={n:T.col('#'),p:T.col('Priority'),u:T.col('Target page'),pr:T.col('Product'),k:T.col('Money keyword'),mc:T.col('Matrix column'),r:T.col('Role'),v:T.col('Monthly volume'),i:T.col('Intent'),pt:T.col('Page type'),a:T.col('Action'),no:T.col('Notes')};
    let trap=false;
    T.rows.forEach(r=>{
      const joined=r.join(' ');
      if(/traffic traps/i.test(joined)){trap=true;return;}
      if(trap){const kw=T.get(r,1);if(!kw||/^keyword$/i.test(kw))return;m.traps.push({keyword:kw,vol:num(T.get(r,c.v)),why:T.get(r,8)});return;}
      const kw=T.get(r,c.k),u=T.get(r,c.u);if(!kw||!u)return;
      if(/money prompt/i.test(T.get(r,c.mc)))return;
      const k=keyOf(u);ensure(k,u,T.get(r,c.pr));
      m.kw.push({key:k,priority:T.get(r,c.p),keyword:kw,matrixCol:T.get(r,c.mc),role:T.get(r,c.r)||'Secondary',vol:num(T.get(r,c.v)),volRaw:T.get(r,c.v),intent:T.get(r,c.i),pageType:T.get(r,c.pt),action:T.get(r,c.a),notes:T.get(r,c.no)});});}
  // Long-tail
  if(RAW.lt){const T=table(RAW.lt);const c={u:T.col('Target page'),pr:T.col('Product'),a:T.col('Ambitious keyword'),av:T.col('Ambitious volume'),k:T.col('Long-tail money keyword'),cb:T.col('Combination'),v:T.col('Long-tail volume'),pt:T.col('Page type')};
    T.rows.forEach(r=>{const u=T.get(r,c.u),kw=T.get(r,c.k);if(!u||!kw)return;const k=keyOf(u);ensure(k,u,T.get(r,c.pr));
      m.lt.push({key:k,ambitious:T.get(r,c.a),ambVol:num(T.get(r,c.av)),keyword:kw,combo:T.get(r,c.cb),vol:num(T.get(r,c.v)),pageType:T.get(r,c.pt)});});}
  // Matrix combinations
  if(RAW.mc){const T=table(RAW.mc);const c={u:T.col('Target page'),t:T.col('Combination type'),k:T.col('Long-tail money keyword'),v:T.col('Volume'),pt:T.col('Page type'),n:T.col('Notes')};
    T.rows.forEach(r=>{const u=T.get(r,c.u),kw=T.get(r,c.k);if(!u||!kw)return;const k=keyOf(u);
      m.mc.push({key:k,type:T.get(r,c.t),keyword:kw,vol:num(T.get(r,c.v)),pageType:T.get(r,c.pt),notes:T.get(r,c.n)});});}
  // Prompts
  if(RAW.mp){const T=table(RAW.mp);const c={u:T.col('Target page'),pr:T.col('Product'),q:T.col('Money prompt'),t:T.col('Prompt type'),pe:T.col('Buyer persona'),s:T.col('Buying stage'),tr:T.col('Track in AEO'),b:T.col('Page to build'),me:T.col('Unstop mentioned'),co:T.col('Competitors mentioned'),so:T.col('Sources cited'),l:T.col('Last checked')};
    T.rows.forEach(r=>{const u=T.get(r,c.u),q=T.get(r,c.q);if(!u||!q)return;const k=keyOf(u);
      m.mp.push({key:k,prompt:q,type:T.get(r,c.t),persona:T.get(r,c.pe),stage:T.get(r,c.s),track:T.get(r,c.tr),build:T.get(r,c.b),mentioned:T.get(r,c.me),competitors:T.get(r,c.co),sources:T.get(r,c.so),last:T.get(r,c.l)});});}
  // Page type plan
  if(RAW.pt){const T=table(RAW.pt);const c={n:T.col('#'),t:T.col('Page type'),bf:T.col('Best for'),k:T.col('Target money keyword'),u:T.col('Suggested URL'),l:T.col('Links to'),s:T.col('Status'),p:T.col('Priority'),v:T.col('Volume'),b:T.col('Blueprint'),no:T.col('Notes'),o:T.col('Owner'),d:T.col('Publish date')};
    T.rows.forEach(r=>{const kw=T.get(r,c.k),t=T.get(r,c.t);if(!kw||!t)return;
      m.pt.push({type:t,keyword:kw,url:T.get(r,c.u),linksTo:keyOf(T.get(r,c.l)),status:T.get(r,c.s),priority:T.get(r,c.p),vol:num(T.get(r,c.v)),blueprint:T.get(r,c.b),notes:T.get(r,c.no),owner:T.get(r,c.o),date:T.get(r,c.d)});});}
  // Refresh queue
  if(RAW.rq){const T=table(RAW.rq);const c={u:T.col('Page URL'),it:T.col('Intent'),cl:T.col('Clicks'),im:T.col('Impressions'),ctr:T.col('CTR'),pos:T.col('Avg position'),nb:T.col('Non branded'),tq:T.col('Top non branded'),sd:T.col('Striking distance'),a:T.col('Refresh action'),p:T.col('Priority'),s:T.col('Status'),rf:T.col('Refreshed on')};
    T.rows.forEach(r=>{const u=T.get(r,c.u);if(!u)return;const k=keyOf(u);
      const row={key:k,url:u,intent:T.get(r,c.it),clicks:num(T.get(r,c.cl)),impr:num(T.get(r,c.im)),ctr:T.get(r,c.ctr),pos:num(T.get(r,c.pos)),nb:T.get(r,c.nb),top:T.get(r,c.tq),striking:T.get(r,c.sd),action:T.get(r,c.a),priority:T.get(r,c.p),status:T.get(r,c.s),refreshed:T.get(r,c.rf)};
      if(/old|duplicate/i.test(row.intent))m.legacy.push(row);else m.rq.push(row);});}
  // Technical
  if(RAW.tech){const T=table(RAW.tech);const hdr=RAW.tech[0]||[];const uc=T.col('Page URL');
    T.rows.forEach(r=>{const u=T.get(r,uc);if(!u||!/unstop\.com/.test(u))return;const o={};hdr.forEach((h,i)=>{if(i!==uc&&h)o[h]=T.get(r,i);});m.tech[keyOf(u)]=o;});}
  // Competitors
  if(RAW.comp){const T=table(RAW.comp);const c={n:T.col('Competitor'),w:T.col('Where they compete'),pa:T.col('Unstop pages affected'),y:T.col('Why buyers switch'),a:T.col('Comparison angle'),b:T.col('Pages to build'),p:T.col('Priority'),v:T.col('Validated')};
    T.rows.forEach(r=>{const n=T.get(r,c.n);if(!n)return;
      m.comp.push({name:n,where:T.get(r,c.w),pages:T.get(r,c.pa).split(/[,;]\s*/).map(s=>s.trim()).filter(Boolean),why:T.get(r,c.y),angle:T.get(r,c.a),build:T.get(r,c.b),priority:T.get(r,c.p),validated:T.get(r,c.v)});});}
  // Content briefs
  if(RAW.cb){const T=table(RAW.cb);const c={k:T.col('Target money keyword'),t:T.col('Page type'),i:T.col('Search intent'),u:T.col('URL'),b:T.col('Benchmark'),l:T.col('Links to'),s:T.col('Status'),w:T.col('Writer'),d:T.col('Due')};
    T.rows.forEach(r=>{const kw=T.get(r,c.k);if(!kw)return;m.cb.push({keyword:kw,type:T.get(r,c.t),intent:T.get(r,c.i),url:T.get(r,c.u),benchmark:T.get(r,c.b),linksTo:keyOf(T.get(r,c.l)),status:T.get(r,c.s),writer:T.get(r,c.w),due:T.get(r,c.d)});});}

  // per-page rollups
  const compMatch=(p,short)=>{const s=lastSeg(keyOf(short));const ls=lastSeg(p.key);return s&&(ls===s||ls.endsWith('-'+s)||(s==='employers'&&p.key==='/employers'));};
  m.pages.forEach(p=>{
    const kws=m.kw.filter(x=>x.key===p.key);
    p.primary=kws.filter(x=>/^primary/i.test(x.role));
    p.secondary=kws.filter(x=>/^secondary/i.test(x.role)).sort((a,b)=>(b.vol||0)-(a.vol||0));
    p.supporting=kws.filter(x=>/support/i.test(x.role)).sort((a,b)=>(b.vol||0)-(a.vol||0));
    p.lt=m.lt.filter(x=>x.key===p.key);
    p.mc=m.mc.filter(x=>x.key===p.key);
    p.mp=m.mp.filter(x=>x.key===p.key);
    const landing=m.pt.find(x=>x.linksTo===p.key&&/existing/i.test(x.status));
    p.landing=landing||null;
    p.newPages=m.pt.filter(x=>x.linksTo===p.key&&!/existing/i.test(x.status));
    p.rq=m.rq.find(x=>x.key===p.key)||null;
    p.tech=m.tech[p.key]||null;
    p.comp=m.comp.filter(c=>c.pages.some(s=>compMatch(p,s)));
    p.cb=m.cb.filter(x=>x.linksTo===p.key);
    const prim=p.primary[0]||null;
    p.primaryKw=prim?prim.keyword:(landing?landing.keyword:'');
    p.primaryVol=prim?prim.vol:(landing?landing.vol:null);
    p.priority=landing?landing.priority:(prim?prim.priority:'');
    p.refreshPrio=p.rq?p.rq.priority:'';
    p.status=landing?landing.status:'';
  });
  // product names from the long-tail / money keyword tabs
  if(RAW.mk){const T=table(RAW.mk);const u=T.col('Target page'),pr=T.col('Product');T.rows.forEach(r=>{const k=keyOf(T.get(r,u));if(m.byKey[k]&&!m.byKey[k].product)m.byKey[k].product=T.get(r,pr);});}
  M=m;
}

function route(){
  if(!M)return;
  const h=decodeURIComponent(location.hash.slice(2));
  const [v,...rest]=h.split('/');
  const page=h.startsWith('page/')?'/'+h.slice(5):null;

const pr=p=>({P1:1,P2:2,P3:3}[p]||9);
function sortRows(rows,key,dir){
  return rows.slice().sort((a,b)=>{let x=a[key],y=b[key];
    if(key==='priorityRank'){x=pr(a.priority);y=pr(b.priority);}
    if(key==='refreshRank'){x=pr(a.refreshPrio);y=pr(b.refreshPrio);}
    const nx=x==null||x==='',ny=y==null||y==='';if(nx&&ny)return 0;if(nx)return 1;if(ny)return -1;
    if(typeof x==='number'&&typeof y==='number')return(x-y)*dir;return String(x).localeCompare(String(y))*dir;});
}
function th(view,key,label,cls=''){const s=state[view];const on=s.sort===key;return`<th class="${cls}${on?' sorted':''}" data-sort="${key}">${label}<span class="arr">${on?(s.dir>0?'▲':'▼'):'↕'}</span></th>`;}
function bindSort(view,rerender){document.querySelectorAll('#view thead th[data-sort]').forEach(t=>t.onclick=()=>{const s=state[view],k=t.dataset.sort;if(s.sort===k)s.dir*=-1;else{s.sort=k;s.dir=['vol','primaryVol','clicks','impr','nSec','nLt','nNew','nPrompts'].includes(k)?-1:1;}rerender();});}
function bindInputs(view,rerender,ids){ids.forEach(([id,field])=>{const el=$(id);if(!el)return;el.value=state[view][field];el.oninput=()=>{state[view][field]=el.value;rerender(true);};});}

/* ---------- ALL KEYWORDS ---------- */
function allKeywords(){
  const out=[];
  M.kw.forEach(x=>out.push({keyword:x.keyword,key:x.key,kind:/^primary/i.test(x.role)?'Primary':/support/i.test(x.role)?'Supporting':'Secondary',detail:x.matrixCol,vol:x.vol,action:x.action,priority:x.priority}));
  M.lt.forEach(x=>out.push({keyword:x.keyword,key:x.key,kind:'Long-tail',detail:x.combo,vol:x.vol,action:x.pageType}));
  M.mc.forEach(x=>out.push({keyword:x.keyword,key:x.key,kind:'Combination',detail:x.type,vol:x.vol,action:x.pageType}));
  M.pt.filter(x=>!/existing/i.test(x.status)).forEach(x=>out.push({keyword:x.keyword,key:x.linksTo,kind:'New page',detail:x.type,vol:x.vol,action:x.url,priority:x.priority}));
  return out;
}
function viewKeywords(partial){
  const s=state.keywords;const all=allKeywords();const q=norm(s.q);const min=num(s.min);
  let rows=all.filter(r=>(!s.kind||r.kind===s.kind)&&(min==null||(r.vol||0)>=min)&&(!q||norm(r.keyword+' '+r.key+' '+r.detail).includes(q)));
  rows=sortRows(rows,s.sort,s.dir);
  const kinds=['Primary','Secondary','Supporting','Long-tail','Combination','New page'];
  const kindTag=k=>`<span class="tag ${k==='Primary'?'good':k==='Secondary'?'acc':k==='New page'?'warn':''}">${k}</span>`;
  const tbl=`<table><thead><tr>${th('keywords','keyword','Keyword')}${th('keywords','vol','Vol','num')}${th('keywords','kind','Type')}${th('keywords','key','Page')}${th('keywords','detail','Detail','hide-sm')}${th('keywords','action','Action / page to build','hide-sm')}</tr></thead><tbody>${rows.slice(0,1500).map(r=>`<tr class="click" data-k="${esc(r.key)}"><td><b>${esc(r.keyword)}</b></td><td class="num">${volHTML(r.vol)}</td><td>${kindTag(r.kind)}</td><td><span class="path">${esc(sp(r.key))}</span></td><td class="hide-sm sub">${esc(r.detail)}</td><td class="hide-sm sub">${esc(r.action)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No keywords match.</td></tr>'}</tbody></table>`;
  if(partial){$('#kwTable').innerHTML=tbl;$('#kwCount').textContent=rows.length+' keywords';bindRows();bindSort('keywords',()=>viewKeywords(true));return;}
  $('#view').innerHTML=`<div class="toolbar">
    <input type="search" id="kq" placeholder="Search keyword or URL…">
    <select id="kk"><option value="">All types</option>${kinds.map(k=>`<option>${k}</option>`).join('')}</select>
    <input type="number" id="km" placeholder="Min volume" min="0">
    <button class="btn" id="kcsv">Download CSV</button>
    <span class="count" id="kwCount">${rows.length} keywords</span></div>
    <div class="card"><div class="tablewrap" id="kwTable">${tbl}</div></div>`;
  bindInputs('keywords',()=>viewKeywords(true),[['#kq','q'],['#kk','kind'],['#km','min']]);
  $('#kcsv').onclick=()=>{const s2=state.keywords,q2=norm(s2.q),m2=num(s2.min);
    const r2=sortRows(allKeywords().filter(r=>(!s2.kind||r.kind===s2.kind)&&(m2==null||(r.vol||0)>=m2)&&(!q2||norm(r.keyword+' '+r.key+' '+r.detail).includes(q2))),s2.sort,s2.dir);
    downloadCSV('keywords.csv',[['Keyword','Volume','Type','Page','Detail','Action / page to build'],...r2.map(r=>[r.keyword,r.vol==null?'':r.vol,r.kind,CONFIG.site+r.key,r.detail,r.action])]);};
  bindRows();bindSort('keywords',()=>viewKeywords(true));
}
function downloadCSV(name,rows){const csv=rows.map(r=>r.map(v=>{v=String(v==null?'':v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove();}

/* ---------- NEW PAGES ---------- */
function viewNew(partial){
  const s=state.newpages;const all=M.pt.filter(x=>!/existing/i.test(x.status));
  const types=[...new Set(all.map(x=>x.type))],stats=[...new Set(all.map(x=>x.status))];
  const q=norm(s.q);
  let rows=all.filter(r=>(!s.type||r.type===s.type)&&(!s.prio||r.priority===s.prio)&&(!s.status||r.status===s.status)&&(!q||norm(r.keyword+' '+r.url+' '+r.linksTo).includes(q)));
  rows=sortRows(rows,s.sort,s.dir);
  const tbl=`<table><thead><tr>${th('newpages','keyword','Target keyword')}${th('newpages','vol','Vol','num')}${th('newpages','type','Page type')}${th('newpages','priorityRank','Prio')}${th('newpages','status','Status')}${th('newpages','url','Suggested URL','hide-sm')}${th('newpages','linksTo','Links to')}</tr></thead><tbody>${rows.map(r=>`<tr class="click" data-k="${esc(r.linksTo)}"><td><b>${esc(r.keyword)}</b>${r.notes?`<div class="sub">${esc(r.notes)}</div>`:''}</td><td class="num">${volHTML(r.vol)}</td><td><span class="tag">${esc(r.type)}</span></td><td>${prioHTML(r.priority)}</td><td><span class="tag ${/publish/i.test(r.status)?'good':/progress|brief/i.test(r.status)?'acc':''}">${esc(r.status)}</span></td><td class="hide-sm"><span class="path">${esc(r.url)}</span></td><td><span class="path">${esc(sp(r.linksTo))}</span></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No pages match.</td></tr>'}</tbody></table>`;
  if(partial){$('#npTable').innerHTML=tbl;$('#npCount').textContent=rows.length+' pages';bindRows();bindSort('newpages',()=>viewNew(true));return;}
  $('#view').innerHTML=`<div class="toolbar">
    <input type="search" id="nq" placeholder="Search keyword or URL…">
    <select id="nt"><option value="">All page types</option>${types.map(t=>`<option>${esc(t)}</option>`).join('')}</select>
    <select id="np"><option value="">Any priority</option><option>P1</option><option>P2</option><option>P3</option></select>
    <select id="ns"><option value="">Any status</option>${stats.map(t=>`<option>${esc(t)}</option>`).join('')}</select>
    <span class="count" id="npCount">${rows.length} pages</span></div>
    <div class="card"><div class="tablewrap" id="npTable">${tbl}</div></div>`;
  bindInputs('newpages',()=>viewNew(true),[['#nq','q'],['#nt','type'],['#np','prio'],['#ns','status']]);
  bindRows();bindSort('newpages',()=>viewNew(true));
}

/* ---------- COMPETITORS ---------- */
function viewComp(partial){
  const s=state.competitors;const q=norm(s.q);
  let rows=M.comp.filter(c=>!q||norm(Object.values(c).join(' ')).includes(q));
  rows=sortRows(rows,s.sort,s.dir);
  const pageLinks=c=>c.pages.map(sh=>{const p=M.pages.find(p=>{const s2=lastSeg(keyOf(sh)),ls=lastSeg(p.key);return ls===s2||ls.endsWith('-'+s2);});return p?`<a href="#/page${esc(p.key)}" class="tag acc">${esc(sh)}</a>`:`<span class="tag">${esc(sh)}</span>`;}).join('');
  const tbl=`<table><thead><tr>${th('competitors','name','Competitor')}${th('competitors','priorityRank','Prio')}<th>Unstop pages</th><th class="hide-sm">Why buyers switch (hypothesis)</th><th class="hide-sm">Angle</th><th>Pages to build</th>${th('competitors','validated','Validated')}</tr></thead><tbody>${rows.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="sub">${esc(c.where)}</div></td><td>${prioHTML(c.priority)}</td><td>${pageLinks(c)}</td><td class="hide-sm">${esc(c.why)}</td><td class="hide-sm">${esc(c.angle)}</td><td>${esc(c.build)}</td><td><span class="tag ${/^yes/i.test(c.validated)?'good':'warn'}">${esc(c.validated||'No')}</span></td></tr>`).join('')}</tbody></table>`;
  if(partial){$('#cTable').innerHTML=tbl;bindSort('competitors',()=>viewComp(true));return;}
  $('#view').innerHTML=`<div class="toolbar"><input type="search" id="cq" placeholder="Search competitor or page…"><span class="count">${M.comp.length} competitors</span></div><div class="card"><div class="tablewrap" id="cTable">${tbl}</div></div>`;
  bindInputs('competitors',()=>viewComp(true),[['#cq','q']]);bindSort('competitors',()=>viewComp(true));
}

/* ---------- PAGE DRAWER ---------- */
let ltFilter='All';
function openPage(key){
  const p=M.byKey[key];const d=$('#drawer');
  if(!p){d.innerHTML=`<div class="dhead"><h2>Page not found</h2><div class="spacer"></div><button class="x" id="dx">×</button></div><div class="dbody"><p>${esc(key)}</p></div>`;}
  else d.innerHTML=pageHTML(p);
  d.classList.add('on');d.setAttribute('aria-hidden','false');$('#scrim').classList.add('on');document.body.style.overflow='hidden';
  $('#dx').onclick=()=>closeDrawer(true);
  const cp=$('#dcopy');if(cp)cp.onclick=()=>copyBrief(p);
  d.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{ltFilter=b.dataset.f;d.querySelector('#ltBox').innerHTML=ltHTML(p);d.querySelectorAll('.chips button').forEach(x=>x.classList.toggle('on',x.dataset.f===ltFilter));});
  d.querySelector('.dbody').scrollTop=0;
}
function closeDrawer(nav){const d=$('#drawer');if(!d.classList.contains('on'))return;d.classList.remove('on');d.setAttribute('aria-hidden','true');$('#scrim').classList.remove('on');document.body.style.overflow='';if(nav)location.hash='#/'+VIEW;}
$('#scrim').onclick=()=>closeDrawer(true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer(true);});

function kwTable(rows,showAction=true){
  if(!rows.length)return'<div class="sub">None mapped.</div>';
  return`<table><thead><tr><th>Keyword</th><th class="num">Vol</th><th class="hide-sm">Matrix column</th>${showAction?'<th>What to do</th>':''}</tr></thead><tbody>${rows.map(k=>`<tr><td><b>${esc(k.keyword)}</b>${k.notes?`<div class="sub">${esc(k.notes)}</div>`:''}</td><td class="num">${volHTML(k.vol==null?k.volRaw:k.vol)}</td><td class="hide-sm sub">${esc(k.matrixCol)}</td>${showAction?`<td class="sub">${esc(k.action)}</td>`:''}</tr>`).join('')}</tbody></table>`;
}
function ltRows(p){
  const r=[];p.lt.forEach(x=>r.push({keyword:x.keyword,vol:x.vol,type:x.combo,pageType:x.pageType,src:'Long-tail'}));
  p.mc.forEach(x=>r.push({keyword:x.keyword,vol:x.vol,type:x.type,pageType:x.pageType,src:'Combination'}));
  return r;
}
function ltCat(t){t=t||'';if(/competitor/i.test(t))return'Competitor';if(/job to be done/i.test(t))return'Job to be done';if(/integration/i.test(t))return'Integration';if(/industry|icp|india|size|use case/i.test(t))return'Solution + segment';return'Other';}
function ltHTML(p){
  let rows=ltRows(p);if(ltFilter!=='All')rows=rows.filter(r=>ltCat(r.type)===ltFilter);
  rows.sort((a,b)=>(b.vol||0)-(a.vol||0));
  if(!rows.length)return'<div class="sub">None in this group.</div>';
  return`<table><thead><tr><th>Long-tail keyword</th><th class="num">Vol</th><th>Combination</th><th class="hide-sm">Page type</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.keyword)}</td><td class="num">${volHTML(r.vol)}</td><td class="sub">${esc(r.type)}</td><td class="hide-sm sub">${esc(r.pageType)}</td></tr>`).join('')}</tbody></table>`;
}
function sec(title,n,inner){return`<section class="sec"><h3>${title}${n!=null?` <span class="n">${n}</span>`:''}</h3><div class="in">${inner}</div></section>`;}
function pageHTML(p){
  const prim=p.primary.length?p.primary:(p.landing?[{keyword:p.landing.keyword,vol:p.landing.vol,intent:'',action:'',notes:p.landing.notes}]:[]);
  const t=p.tech||{};const rq=p.rq;
  const target=prim.length?prim.map(k=>`<div class="target"><div><div class="kw">${esc(k.keyword)}</div><div class="meta">${esc([k.intent,k.matrixCol].filter(Boolean).join(' · '))}</div></div><div>${volHTML(k.vol)}<div class="sub" style="text-align:right">searches / mo</div></div></div>${k.action?`<div class="note"><b>Where to use it</b>${esc(k.action)}</div>`:''}${k.notes?`<div class="note"><b>Note</b>${esc(k.notes)}</div>`:''}`).join('<hr style="border:0;border-top:1px solid var(--line);margin:12px 0">'):'<div class="sub">No primary keyword set.</div>';
  const extra=[p.landing&&p.landing.notes&&!p.primary.some(k=>k.notes===p.landing.notes)?`<div class="note"><b>Page plan note</b>${esc(p.landing.notes)}</div>`:'',
    rq&&rq.action?`<div class="note"><b>Refresh action ${prioHTML(rq.priority)}</b>${esc(rq.action)}</div>`:'',
    t['Title Google sees']?`<div class="note"><b>Title Google sees now</b>${esc(t['Title Google sees'])}</div>`:''].join('');
  const ltAll=ltRows(p);const cats=['All',...['Solution + segment','Competitor','Job to be done','Integration','Other'].filter(c=>ltAll.some(r=>ltCat(r.type)===c))];
  const mx=p.matrix?`<div class="mx">${[['Solution',p.matrix.solution],['Industry / ICP',p.matrix.industry],['Competitor',p.matrix.competitor],['Job to be done',p.matrix.jobs],['Integration',p.matrix.integrations]].map(([h,l])=>`<div><h4>${h}</h4><ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')||'<li class="sub">—</li>'}</ul></div>`).join('')}</div>${p.matrix.why?`<div class="note"><b>Why buyers switch (hypothesis)</b>${esc(p.matrix.why)}</div>`:''}`:'<div class="sub">Not in the matrix.</div>';
  const np=p.newPages.slice().sort((a,b)=>pr(a.priority)-pr(b.priority)||(b.vol||0)-(a.vol||0));
  const npHTML=np.length?`<table><thead><tr><th>Target keyword</th><th class="num">Vol</th><th>Type</th><th>Prio</th><th class="hide-sm">URL</th><th>Status</th></tr></thead><tbody>${np.map(r=>`<tr><td><b>${esc(r.keyword)}</b>${r.notes?`<div class="sub">${esc(r.notes)}</div>`:''}</td><td class="num">${volHTML(r.vol)}</td><td class="sub">${esc(r.type)}</td><td>${prioHTML(r.priority)}</td><td class="hide-sm"><span class="path">${esc(r.url)}</span></td><td><span class="tag">${esc(r.status)}</span></td></tr>`).join('')}</tbody></table>`:'<div class="sub">No new pages planned for this URL.</div>';
  const mpHTML=p.mp.length?`<table><thead><tr><th>Prompt</th><th class="hide-sm">Type · stage</th><th>Track</th><th>Unstop mentioned?</th></tr></thead><tbody>${p.mp.map(x=>`<tr><td>${esc(x.prompt)}<div class="sub">${esc(x.persona)} → ${esc(x.build)}</div></td><td class="hide-sm sub">${esc(x.type)} · ${esc(x.stage)}</td><td>${/^yes/i.test(x.track)?'<span class="tag good">Yes</span>':'<span class="tag">No</span>'}</td><td>${x.mentioned?`<span class="tag ${/^yes/i.test(x.mentioned)?'good':'bad'}">${esc(x.mentioned)}</span>`:'<span class="sub">not checked</span>'}</td></tr>`).join('')}</tbody></table>`:'<div class="sub">No prompts.</div>';
  const gsc=rq?`<div class="stats"><div><b>${fmt(rq.clicks)}</b><span>Clicks 90d</span></div><div><b>${fmt(rq.impr)}</b><span>Impressions</span></div><div><b>${esc(rq.ctr||'—')}</b><span>CTR</span></div><div><b>${rq.pos==null?'—':rq.pos.toFixed(1)}</b><span>Avg position</span></div><div><b>${esc(rq.nb||'—')}</b><span>Non-branded share</span></div></div>${rq.top?`<div class="note"><b>Top non-branded query</b>${esc(rq.top)}</div>`:''}${rq.striking?`<div class="note"><b>Striking distance (pos 4–20)</b>${rq.striking.split(/;\s*/).map(s=>`<span class="tag acc">${esc(s)}</span>`).join('')}</div>`:''}<div class="sub" style="margin-top:8px">Refresh status: ${esc(rq.status||'—')}${rq.refreshed?' · refreshed '+esc(rq.refreshed):''}</div>`:'<div class="sub">No Search Console data for this URL.</div>';
  const techKeys=Object.keys(t).filter(k=>t[k]&&!/^fix/i.test(k)&&!/title google/i.test(k));
  const techHTML=p.tech?`<div>${techKeys.map(k=>{const v=t[k];const cls=/^(yes|pass|submitted and indexed)/i.test(v)?'good':/missing|^no$|fail|error|recheck|merchant/i.test(v)?'bad':/to check/i.test(v)?'':'acc';return`<span class="tag ${cls}" title="${esc(k)}">${esc(k)}: ${esc(v)}</span>`;}).join('')}</div>${t['Fix needed']?`<div class="note"><b>Fix needed</b>${esc(t['Fix needed'])}</div>`:''}`:'<div class="sub">No technical check for this URL.</div>';
  const compHTML=p.comp.length?`<table><thead><tr><th>Competitor</th><th>Prio</th><th class="hide-sm">Angle to lead with</th><th>Pages to build</th></tr></thead><tbody>${p.comp.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="sub">${esc(c.why)}</div></td><td>${prioHTML(c.priority)}</td><td class="hide-sm">${esc(c.angle)}</td><td class="sub">${esc(c.build)}</td></tr>`).join('')}</tbody></table>`:'<div class="sub">No competitors mapped.</div>';
  const cbHTML=p.cb.length?`<table><thead><tr><th>Brief</th><th>Type</th><th class="hide-sm">Benchmark to beat</th><th>Status</th></tr></thead><tbody>${p.cb.map(c=>`<tr><td><b>${esc(c.keyword)}</b><div class="sub path">${esc(c.url)}</div></td><td class="sub">${esc(c.type)}</td><td class="hide-sm sub">${/^https?:/.test(c.benchmark)?`<a href="${esc(c.benchmark)}" target="_blank" rel="noopener">${esc(c.benchmark.replace(/^https?:\/\//,''))}</a>`:esc(c.benchmark)}</td><td><span class="tag">${esc(c.status)}</span></td></tr>`).join('')}</tbody></table>`:'';
  return `<div class="dhead"><div style="flex:1;min-width:0"><h2>${esc(p.product||lastSeg(p.key))}</h2><div class="path"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.key)} ↗</a></div>
    <div style="margin-top:6px">${prioHTML(p.priority)} <span class="tag">${esc(p.group)}</span>${p.status?` <span class="tag">${esc(p.status)}</span>`:''}</div></div>
    <button class="btn" id="dcopy" title="Copy a keyword brief for this page">Copy brief</button><button class="x" id="dx" aria-label="Close">×</button></div>
  <div class="dbody">
    ${sec('🎯 Primary target',null,target+extra)}
    ${sec('Secondary keywords',p.secondary.length,'<div class="sub" style="margin-bottom:6px">Use in H2s, FAQ and meta on this page.</div>'+kwTable(p.secondary))}
    ${p.supporting.length?sec('Supporting content keywords',p.supporting.length,'<div class="sub" style="margin-bottom:6px">Build these as separate pages that link back here.</div>'+kwTable(p.supporting)):''}
    ${sec('Long-tail keywords',ltAll.length,`<div class="chips">${cats.map(c=>`<button data-f="${esc(c)}" class="${c===ltFilter?'on':''}">${esc(c)}</button>`).join('')}</div><div id="ltBox">${ltHTML(p)}</div>`)}
    ${sec('New pages that link here',np.length,npHTML)}
    ${sec('Money prompts (AI search)',p.mp.length,mpHTML)}
    ${sec('Search Console, last 90 days',null,gsc)}
    ${sec('Money Keyword Matrix',null,mx)}
    ${sec('Competitors',p.comp.length,compHTML)}
    ${cbHTML?sec('Content briefs',p.cb.length,cbHTML):''}
    ${sec('Technical & AI readiness',null,techHTML)}
  </div>`;
}
function copyBrief(p){
  const L=[];const v=x=>x==null?'n/a':fmt(x);
  L.push(`# ${p.product||p.key}`,`URL: ${p.url}`,'');
  L.push('## Primary keyword');(p.primary.length?p.primary:[]).forEach(k=>L.push(`- ${k.keyword} (${v(k.vol)}/mo)`));if(!p.primary.length&&p.primaryKw)L.push(`- ${p.primaryKw} (${v(p.primaryVol)}/mo)`);
  L.push('','## Secondary keywords (H2s, FAQ, meta)');p.secondary.forEach(k=>L.push(`- ${k.keyword} (${v(k.vol)})`));
  const lt=ltRows(p).sort((a,b)=>(b.vol||0)-(a.vol||0));if(lt.length){L.push('','## Long-tail keywords');lt.forEach(r=>L.push(`- ${r.keyword} (${v(r.vol)}) · ${r.type}`));}
  if(p.mp.length){L.push('','## Money prompts to answer');p.mp.forEach(x=>L.push(`- ${x.prompt}`));}
  if(p.rq&&p.rq.action){L.push('','## Refresh action',p.rq.action);}
  if(p.tech&&p.tech['Fix needed']){L.push('','## Technical fix',p.tech['Fix needed']);}
  const txt=L.join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Brief copied')).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Brief copied');}catch(e){toast('Copy failed');}ta.remove();});
}

load();
</script>
